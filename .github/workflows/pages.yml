name: Deploy marketing site to Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Resolve GitHub Pages URLs
        id: pages-url
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository,,}" == "${owner,,}.github.io" ]]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${repository}/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner}.github.io/${repository}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages-url.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages-url.outputs.site_url }}
      - name: Add Pages SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
