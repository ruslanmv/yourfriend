name: Deploy marketing site to Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: /yourfriend/
          VITE_SITE_URL: https://ruslanmv.com/yourfriend/
      - name: Create custom-domain Pages artifact
        run: |
          mkdir -p pages-root
          mv dist pages-root/yourfriend
          mv pages-root/yourfriend/CNAME pages-root/CNAME
          cp pages-root/yourfriend/index.html pages-root/404.html
          touch pages-root/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
