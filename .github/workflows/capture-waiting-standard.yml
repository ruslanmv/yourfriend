name: Capture Waiting-standard hero poster

on:
  push:
    branches:
      - fix/vrm-framing-live-demo
    paths:
      - scripts/capture_waiting_standard.py
      - .github/workflows/capture-waiting-standard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Capture Waiting-standard avatar
        run: python scripts/capture_waiting_standard.py

      - name: Commit generated poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatar/posters/companion-waiting-standard.png
          if git diff --cached --quiet; then
            echo "Waiting-standard poster is unchanged"
            exit 0
          fi
          git commit -m "Generate Waiting-standard companion poster"
          git push origin HEAD:fix/vrm-framing-live-demo
