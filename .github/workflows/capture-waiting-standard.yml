name: Capture Waiting-standard hero poster

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
    paths:
      - scripts/capture_waiting_standard.py
      - .github/workflows/capture-waiting-standard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Capture Waiting-standard avatar
        run: python scripts/capture_waiting_standard.py

      - name: Verify PNG transparency
        run: |
          python - <<'PY'
          from PIL import Image

          path = 'public/avatar/posters/companion-waiting-standard.png'
          image = Image.open(path).convert('RGBA')
          alpha = image.getchannel('A')
          width, height = image.size
          corners = [
              alpha.getpixel((0, 0)),
              alpha.getpixel((width - 1, 0)),
              alpha.getpixel((0, height - 1)),
              alpha.getpixel((width - 1, height - 1)),
          ]
          transparent = sum(1 for value in alpha.getdata() if value <= 8)
          ratio = transparent / (width * height)
          print(f'corners={corners} transparent_ratio={ratio:.3f}')
          if min(corners) > 8 or ratio < 0.10:
              raise SystemExit('Poster background is not genuinely transparent')
          PY

      - name: Upload generated poster
        uses: actions/upload-artifact@v4
        with:
          name: waiting-standard-poster
          path: public/avatar/posters/companion-waiting-standard.png

      - name: Commit generated poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatar/posters/companion-waiting-standard.png
          if git diff --cached --quiet; then
            echo "Waiting-standard poster is unchanged"
            exit 0
          fi
          git commit -m "Generate transparent Waiting-standard companion poster"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
