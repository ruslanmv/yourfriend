<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Static-first hero rendering architecture</title><desc id="desc">Independent ambient, overlay, poster, optional VRM, interface and navigation layers.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162944"/><stop offset="1" stop-color="#645f91"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter></defs>
<rect width="1100" height="440" rx="28" fill="#f7f7fb"/>
<text x="64" y="64" font-family="Georgia,serif" font-size="29" fill="#203250">Hero composition</text><text x="64" y="91" font-family="Arial,sans-serif" font-size="14" fill="#68758c">Independent layers preserve speed, readability, and graceful failure.</text>
<g transform="translate(385 72) skewX(-12)" filter="url(#shadow)">
<g transform="translate(0 235)"><rect width="560" height="92" rx="16" fill="url(#bg)"/><text x="30" y="54" fill="white" font-family="Arial" font-size="18">01 · Ambient scene slider</text></g>
<g transform="translate(0 178)"><rect width="560" height="78" rx="16" fill="#b6c7e5" fill-opacity=".92"/><text x="30" y="47" fill="#203250" font-family="Arial" font-size="18">02 · Readability &amp; lighting overlays</text></g>
<g transform="translate(0 120)"><rect width="560" height="78" rx="16" fill="#fff2df"/><text x="30" y="47" fill="#203250" font-family="Arial" font-size="18">03 · Premium static poster · always</text></g>
<g transform="translate(0 62)"><rect width="560" height="78" rx="16" fill="#dcd8f7"/><text x="30" y="47" fill="#203250" font-family="Arial" font-size="18">04 · Lazy live VRM · optional</text></g>
<g><rect width="560" height="82" rx="16" fill="white"/><text x="30" y="49" fill="#203250" font-family="Arial" font-size="18">05 · Semantic HTML copy &amp; controls</text></g>
</g>
<g font-family="Arial,sans-serif" font-size="14" fill="#586780"><circle cx="92" cy="180" r="8" fill="#efb76e"/><text x="112" y="185">Poster is the production baseline</text><circle cx="92" cy="222" r="8" fill="#7d91cc"/><text x="112" y="227">VRM never blocks first render</text><circle cx="92" cy="264" r="8" fill="#9a8fc7"/><text x="112" y="269">Failure leaves poster untouched</text><circle cx="92" cy="306" r="8" fill="#77a7a0"/><text x="112" y="311">Reduced motion stays fully static</text></g>
</svg>
